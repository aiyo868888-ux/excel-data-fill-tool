<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送货商配置管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card-shadow {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">⚙️ 送货商配置管理</h1>
            <p class="text-white opacity-90">管理送货商名称和对应的列范围</p>
        </div>

        <!-- 主卡片 -->
        <div class="bg-white rounded-2xl card-shadow p-8">
            <!-- 添加新送货商 -->
            <div class="mb-8">
                <h2 class="text-xl font-bold mb-4 text-gray-800">➕ 添加新送货商</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">送货商名称</label>
                        <input type="text" id="newSupplierName" placeholder="如: 万邦-冻品" class="w-full border rounded-lg p-3">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">起始列</label>
                        <input type="text" id="newStartColumn" placeholder="Q" class="w-full border rounded-lg p-3 uppercase font-bold text-center" maxlength="3">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">终止列</label>
                        <input type="text" id="newEndColumn" placeholder="U" class="w-full border rounded-lg p-3 uppercase font-bold text-center" maxlength="3">
                    </div>
                </div>
                <div class="mt-4">
                    <button onclick="addSupplier()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg">
                        ✅ 添加送货商
                    </button>
                </div>
            </div>

            <!-- 现有送货商列表 -->
            <div>
                <h2 class="text-xl font-bold mb-4 text-gray-800">📋 现有送货商配置</h2>
                <div id="supplierList" class="space-y-3">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 保存按钮 -->
            <div class="mt-8 pt-6 border-t">
                <button onclick="saveConfig(true)" class="w-full btn-primary text-white font-bold py-4 px-6 rounded-lg text-lg">
                    💾 手动保存配置
                </button>
                <p class="text-sm text-gray-500 text-center mt-2">提示：添加、编辑、删除操作会自动保存</p>
            </div>
        </div>

        <!-- 返回按钮 -->
        <div class="text-center mt-6">
            <a href="/" class="inline-block bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-bold py-3 px-8 rounded-lg">
                ← 返回数据填充工具
            </a>
        </div>
    </div>

    <script>
        let suppliersConfig = { suppliers: [] };

        // 加载配置
        async function loadConfig() {
            try {
                const response = await fetch('/api/suppliers-config');
                suppliersConfig = await response.json();
                renderSuppliers();
            } catch (error) {
                alert('加载配置失败: ' + error.message);
            }
        }

        // 渲染送货商列表
        function renderSuppliers() {
            const container = document.getElementById('supplierList');
            container.innerHTML = suppliersConfig.suppliers.map((s, idx) => `
                <div class="bg-gray-50 rounded-lg p-4 flex items-center justify-between">
                    <div class="flex-1 grid grid-cols-3 gap-4 items-center">
                        <div>
                            <span class="text-xs text-gray-500">名称</span>
                            <p class="font-bold text-gray-800">${s.name}</p>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500">起始列</span>
                            <p class="font-bold text-purple-600">${s.start_column}</p>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500">终止列</span>
                            <p class="font-bold text-purple-600">${s.end_column}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 ml-4">
                        <button onclick="editSupplier(${idx})" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded">
                            ✏️ 编辑
                        </button>
                        <button onclick="deleteSupplier(${idx})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded">
                            🗑️ 删除
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 添加送货商
        function addSupplier() {
            const name = document.getElementById('newSupplierName').value.trim();
            const start_column = document.getElementById('newStartColumn').value.trim().toUpperCase();
            const end_column = document.getElementById('newEndColumn').value.trim().toUpperCase();

            if (!name || !start_column || !end_column) {
                alert('请填写所有字段');
                return;
            }

            suppliersConfig.suppliers.push({
                name,
                start_column,
                end_column,
                file_pattern: name // 保留 file_pattern 字段以兼容现有配置，但使用 name 作为值
            });

            // 清空输入框
            document.getElementById('newSupplierName').value = '';
            document.getElementById('newStartColumn').value = '';
            document.getElementById('newEndColumn').value = '';

            renderSuppliers();

            // 自动保存
            saveConfig();
        }

        // 删除送货商
        function deleteSupplier(index) {
            if (confirm('确定要删除这个送货商配置吗？')) {
                suppliersConfig.suppliers.splice(index, 1);
                renderSuppliers();

                // 自动保存
                saveConfig();
            }
        }

        // 编辑送货商
        function editSupplier(index) {
            const supplier = suppliersConfig.suppliers[index];
            const newStartCol = prompt('请输入新的起始列:', supplier.start_column);
            if (newStartCol === null) return;

            const newEndCol = prompt('请输入新的终止列:', supplier.end_column);
            if (newEndCol === null) return;

            suppliersConfig.suppliers[index].start_column = newStartCol.toUpperCase();
            suppliersConfig.suppliers[index].end_column = newEndCol.toUpperCase();

            renderSuppliers();

            // 自动保存
            saveConfig();
        }

        // 保存配置
        async function saveConfig(showAlert = false) {
            try {
                const response = await fetch('/api/suppliers-config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(suppliersConfig)
                });

                const result = await response.json();

                if (result.success) {
                    if (showAlert) {
                        alert('✅ 配置已保存！\n\n请返回首页重新上传报表以应用新配置。');
                        // 自动跳转到首页
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        console.log('配置已自动保存');
                    }
                } else {
                    alert('❌ ' + result.message);
                }
            } catch (error) {
                alert('保存失败: ' + error.message);
            }
        }

        // 页面加载时获取配置
        loadConfig();
    </script>
</body>
</html>
