<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDrop - 文件传输</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f1ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
        }

        .upload-hint {
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            display: none;
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .file-size {
            color: #888;
            font-size: 12px;
        }

        .progress {
            display: none;
            margin-top: 15px;
        }

        .progress.show {
            display: block;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            display: none;
            background: #f0f9ff;
            border: 2px solid #00d4aa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            color: #00d4aa;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-path {
            background: white;
            border-radius: 8px;
            padding: 12px;
            color: #333;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: #00d4aa;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .copy-btn:hover {
            background: #00c29a;
        }

        .error {
            display: none;
            background: #fef2f2;
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            color: #ef4444;
        }

        .error.show {
            display: block;
        }

        .server-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .server-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>QuickDrop</h1>
            <p class="subtitle">局域网文件传输 · 自动归档</p>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">点击或拖拽文件到这里</div>
                <div class="upload-hint">支持任意类型文件</div>
            </div>

            <input type="file" id="fileInput">

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>

                <div class="progress" id="progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>

                <button class="btn btn-upload" id="uploadBtn">开始上传</button>
            </div>

            <div class="result" id="result">
                <div class="result-title">✓ 上传成功</div>
                <div class="result-path" id="resultPath"></div>
                <button class="copy-btn" id="copyBtn">复制文件路径</button>
            </div>

            <div class="error" id="error"></div>
        </div>

        <div class="card">
            <div class="server-info" id="serverInfo">
                <p>正在获取服务器信息...</p>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const resultPath = document.getElementById('resultPath');
        const copyBtn = document.getElementById('copyBtn');
        const error = document.getElementById('error');
        const serverInfo = document.getElementById('serverInfo');

        let selectedFile = null;

        // 获取服务器信息
        fetch('/info')
            .then(res => res.json())
            .then(data => {
                serverInfo.innerHTML = `
                    <p>服务器: ${data.url}</p>
                    <p>文件自动归档到: uploads/今日日期/</p>
                `;
            })
            .catch(() => {
                serverInfo.innerHTML = '<p>服务器连接中...</p>';
            });

        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        function selectFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            fileInfo.classList.add('show');
            result.classList.remove('show');
            error.classList.remove('show');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 上传按钮
        uploadBtn.addEventListener('click', uploadFile);

        function uploadFile() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            progress.classList.add('show');
            uploadBtn.disabled = true;
            error.classList.remove('show');

            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    progressText.textContent = percent + '%';
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        resultPath.textContent = response.data.path;
                        result.classList.add('show');
                    } else {
                        showError(response.message);
                    }
                } else {
                    showError('上传失败，请重试');
                }
                uploadBtn.disabled = false;
                progress.classList.remove('show');
            });

            xhr.addEventListener('error', () => {
                showError('网络错误，请检查连接');
                uploadBtn.disabled = false;
                progress.classList.remove('show');
            });

            xhr.open('POST', '/upload');
            xhr.send(formData);
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        // 复制路径
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(resultPath.textContent).then(() => {
                copyBtn.textContent = '✓ 已复制';
                setTimeout(() => {
                    copyBtn.textContent = '复制文件路径';
                }, 2000);
            });
        });
    </script>
</body>
</html>
