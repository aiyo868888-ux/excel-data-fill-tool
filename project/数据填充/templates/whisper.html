<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音识别 - Whisper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .upload-zone {
            border: 3px dashed #cbd5e1;
            transition: all 0.3s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }
        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">🎤 语音识别工具</h1>
            <p class="text-white opacity-90">基于 OpenAI Whisper 的音频转文字工具</p>
        </div>

        <!-- 主卡片 -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- 配置选项 -->
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800">⚙️ 配置选项</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 模型选择 -->
                    <div>
                        <label class="block text-sm text-gray-600 mb-2">识别模型</label>
                        <select id="modelSelect" class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <option value="tiny">Tiny（最快，准确度较低）</option>
                            <option value="base" selected>Base（推荐，平衡速度和准确度）</option>
                            <option value="small">Small（较准确，速度较慢）</option>
                            <option value="medium">Medium（准确，速度慢）</option>
                            <option value="large">Large（最准确，速度最慢）</option>
                        </select>
                    </div>

                    <!-- 输出格式 -->
                    <div>
                        <label class="block text-sm text-gray-600 mb-2">输出格式</label>
                        <div class="flex flex-wrap gap-4 mt-3">
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" id="formatTxt" checked class="mr-2 w-4 h-4 text-purple-600">
                                <span class="text-sm">TXT（纯文本）</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" id="formatSrt" checked class="mr-2 w-4 h-4 text-purple-600">
                                <span class="text-sm">SRT（字幕）</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" id="formatVtt" class="mr-2 w-4 h-4 text-purple-600">
                                <span class="text-sm">VTT（Web 字幕）</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 上传区域 -->
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800">📁 上传音频文件</h2>
                <div id="uploadZone" class="upload-zone rounded-xl p-12 text-center cursor-pointer">
                    <div class="text-6xl mb-4">🎵</div>
                    <p class="text-lg text-gray-700 mb-2">拖拽音频文件到这里</p>
                    <p class="text-sm text-gray-500">或者点击选择文件</p>
                    <p class="text-xs text-gray-400 mt-4">支持格式：MP3, WAV, M4A, MP4, OGG, FLAC（最大 500MB）</p>
                    <input type="file" id="audioInput" accept="audio/*,video/*" class="hidden">
                </div>
            </div>

            <!-- 进度显示 -->
            <div id="progressContainer" class="mb-6 hidden">
                <h2 class="text-xl font-bold mb-4 text-gray-800">📊 处理进度</h2>

                <!-- 进度条 -->
                <div class="mb-4">
                    <div class="flex justify-between text-sm text-gray-600 mb-2">
                        <span id="progressMessage">正在处理...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-6 overflow-hidden">
                        <div id="progressBar" class="progress-bar h-full text-white text-center font-bold text-sm leading-6" style="width: 0%">0%</div>
                    </div>
                </div>

                <!-- 日志 -->
                <div class="bg-gray-900 text-green-400 rounded-lg p-4 log-container">
                    <div id="logContent" class="space-y-1"></div>
                </div>
            </div>

            <!-- 结果显示 -->
            <div id="resultContainer" class="hidden">
                <h2 class="text-xl font-bold mb-4 text-gray-800">✅ 转换完成</h2>

                <!-- 文本预览 -->
                <div class="mb-4">
                    <h3 class="text-lg font-semibold text-gray-700 mb-2">文本预览</h3>
                    <div id="textPreview" class="bg-gray-50 border rounded-lg p-4 max-h-60 overflow-y-auto text-gray-800 whitespace-pre-wrap"></div>
                </div>

                <!-- 下载按钮 -->
                <div class="flex flex-wrap gap-4">
                    <button id="downloadTxt" class="hidden bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg">
                        📄 下载 TXT
                    </button>
                    <button id="downloadSrt" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg">
                        🎬 下载 SRT
                    </button>
                    <button id="downloadVtt" class="hidden bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg">
                        🌐 下载 VTT
                    </button>
                </div>

                <!-- 重新开始 -->
                <button onclick="resetUI()" class="mt-6 text-gray-600 hover:text-gray-800 underline">
                    🔄 处理另一个文件
                </button>
            </div>

            <!-- 错误显示 -->
            <div id="errorContainer" class="hidden">
                <div class="bg-red-100 border border-red-400 text-red-700 rounded-lg p-4">
                    <h3 class="font-bold mb-2">❌ 处理失败</h3>
                    <p id="errorMessage"></p>
                </div>
                <button onclick="resetUI()" class="mt-4 text-gray-600 hover:text-gray-800 underline">
                    🔄 重新开始
                </button>
            </div>
        </div>

        <!-- 返回主页 -->
        <div class="text-center mt-6">
            <a href="/" class="text-white hover:text-gray-200 underline">← 返回主页</a>
        </div>
    </div>

    <script src="/static/whisper.js"></script>
</body>
</html>
