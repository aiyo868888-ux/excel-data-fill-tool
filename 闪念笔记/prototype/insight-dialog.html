<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>闪念笔记 - 启发对话框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 280px;
            height: 560px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 12px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 对话框 */
        .dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            width: calc(100% - 24px);
            max-height: calc(100% - 24px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* 顶部栏 */
        .dialog-header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .dialog-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .dialog-title .icon {
            font-size: 20px;
        }

        .close-btn {
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            color: white;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 内容区 */
        .dialog-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 来源选择区 */
        .source-section {
            margin-bottom: 12px;
        }

        .source-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .source-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .source-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 6px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .source-btn:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .source-btn.active {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .source-btn .icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .source-btn .label {
            font-size: 10px;
            color: #6b7280;
        }

        /* 来源详情输入框 */
        .source-detail-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .source-detail-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .source-detail-input::placeholder {
            color: #9ca3af;
        }

        /* 内容输入区 */
        .content-section {
            margin-bottom: 12px;
        }

        .content-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .input-textarea {
            width: 100%;
            min-height: 120px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-textarea::placeholder {
            color: #9ca3af;
        }

        /* 关键启发输入框 */
        .key-insight-wrapper {
            margin-bottom: 12px;
        }

        .key-insight-label {
            font-size: 12px;
            font-weight: 600;
            color: #1e40af;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .key-insight-label .icon {
            font-size: 12px;
        }

        .key-insight-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .key-insight-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .key-insight-input::placeholder {
            color: #9ca3af;
        }

        .key-insight-hint {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid #e5e7eb;
        }

        .toolbar-left {
            display: flex;
            gap: 6px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 11px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .toolbar-btn.active {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e40af;
        }

        .toolbar-btn .icon {
            font-size: 12px;
        }

        .clipboard-count {
            min-width: 16px;
            height: 16px;
            background: #3b82f6;
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: 600;
        }

        .toolbar-btn.has-clipboard .clipboard-count {
            background: #10b981;
        }

        /* 悬浮窗状态 */
        .floating-status {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: #6b7280;
            padding: 3px 6px;
            background: #dbeafe;
            border-radius: 6px;
        }

        .floating-status .icon {
            font-size: 11px;
        }

        .floating-status.ready {
            background: #d1fae5;
            color: #059669;
        }

        /* 标签栏 */
        .tags-section {
            padding: 6px 0;
            border-top: 1px solid #e5e7eb;
        }

        .tags-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tags-display {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            min-height: 24px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 6px;
            background: #dbeafe;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            font-size: 10px;
            color: #1e40af;
        }

        .tag-text {
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tag-remove {
            width: 14px;
            height: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            cursor: pointer;
            font-size: 9px;
            transition: all 0.2s ease;
        }

        .tag-remove:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .tag-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            transition: all 0.2s ease;
        }

        .tag-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .tag-input::placeholder {
            color: #9ca3af;
        }

        .tags-hint {
            font-size: 9px;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* 智能提示 */
        .smart-hint {
            padding: 6px 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            margin-bottom: 8px;
            display: none;
        }

        .smart-hint.show {
            display: block;
        }

        .smart-hint .hint-content {
            font-size: 11px;
            color: #1e40af;
            line-height: 1.4;
        }

        .smart-hint .hint-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .hint-btn {
            padding: 4px 8px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hint-btn:hover {
            background: #2563eb;
        }

        .hint-btn.secondary {
            background: #f3f4f6;
            color: #6b7280;
        }

        .hint-btn.secondary:hover {
            background: #e5e7eb;
        }

        /* 底部按钮区 */
        .dialog-footer {
            padding: 12px 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        /* 外部提示 */
        .external-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
        }

        /* 滚动条美化 */
        .dialog-content::-webkit-scrollbar {
            width: 4px;
        }

        .dialog-content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .dialog-content::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 2px;
        }

        .dialog-content::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 对话框 -->
        <div class="dialog">
            <!-- 顶部栏 -->
            <div class="dialog-header">
                <div class="dialog-title">
                    <span class="icon">📖</span>
                    <span>启发</span>
                </div>
                <div class="close-btn">✕</div>
            </div>

            <!-- 内容区 -->
            <div class="dialog-content">
                <!-- 来源选择区 -->
                <div class="source-section">
                    <div class="source-section-title">来自哪里？（可选）</div>

                    <!-- 来源按钮 -->
                    <div class="source-buttons">
                        <div class="source-btn" data-source="book">
                            <span class="icon">📚</span>
                            <span class="label">书籍</span>
                        </div>
                        <div class="source-btn" data-source="podcast">
                            <span class="icon">🎙️</span>
                            <span class="label">播客</span>
                        </div>
                        <div class="source-btn" data-source="web">
                            <span class="icon">🌐</span>
                            <span class="label">网络</span>
                        </div>
                        <div class="source-btn" data-source="conversation">
                            <span class="icon">💬</span>
                            <span class="label">对话</span>
                        </div>
                        <div class="source-btn" data-source="course">
                            <span class="icon">👨‍🏫</span>
                            <span class="label">课程</span>
                        </div>
                        <div class="source-btn" data-source="other">
                            <span class="icon">📝</span>
                            <span class="label">其他</span>
                        </div>
                    </div>

                    <!-- 来源详情输入框 -->
                    <input
                        type="text"
                        class="source-detail-input"
                        id="sourceDetailInput"
                        placeholder="具体来源（如：书名、文章标题等）"
                    />
                </div>

                <!-- 智能提示 -->
                <div class="smart-hint" id="smartHint">
                    <div class="hint-content" id="hintContent">
                        💓 检测到 URL，是否设为来源？
                    </div>
                    <div class="hint-actions" id="hintActions">
                        <button class="hint-btn" id="hintConfirm">是</button>
                        <button class="hint-btn secondary" id="hintIgnore">忽略</button>
                    </div>
                </div>

                <!-- 内容输入区 -->
                <div class="content-section">
                    <div class="content-section-title">内容</div>
                    <textarea
                        class="input-textarea"
                        id="contentTextarea"
                        placeholder="在这里记录你的感悟...&#10;&#10;示例：&#10;• 读书时学到的概念&#10;• 听播客得到的启发&#10;• 看文章学到的技巧&#10;• 与他人交流的收获"
                    ></textarea>
                </div>

                <!-- 关键启发输入框 -->
                <div class="key-insight-wrapper">
                    <div class="key-insight-label">
                        <span class="icon">✨</span>
                        <span>关键启发（可选）</span>
                    </div>
                    <input
                        type="text"
                        class="key-insight-input"
                        id="keyInsightInput"
                        placeholder="用一句话提炼核心启发点"
                    />
                    <div class="key-insight-hint">
                        💡 提示：将长内容浓缩成一句话，方便日后回顾
                    </div>
                </div>

                <!-- 工具栏 -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <!-- 剪切板按钮 -->
                        <div class="toolbar-btn" id="clipboardBtn">
                            <span class="icon">📋</span>
                            <span class="clipboard-count" id="clipboardCount">0</span>
                        </div>

                        <!-- 标签按钮 -->
                        <div class="toolbar-btn" id="tagsBtn">
                            <span class="icon">🏷️</span>
                            <span>标签</span>
                            <span class="clipboard-count" id="tagsCount">0</span>
                        </div>
                    </div>

                    <!-- 悬浮窗状态 -->
                    <div class="floating-status" id="floatingStatus">
                        <span class="icon">💓</span>
                        <span>可粘贴</span>
                    </div>
                </div>

                <!-- 标签栏 -->
                <div class="tags-section" id="tagsSection" style="display: none;">
                    <div class="tags-input-wrapper">
                        <!-- 已添加的标签 -->
                        <div class="tags-display" id="tagsDisplay">
                            <!-- 标签会动态添加到这里 -->
                        </div>

                        <!-- 标签输入框 -->
                        <input
                            type="text"
                            class="tag-input"
                            id="tagInput"
                            placeholder="输入标签，按回车添加"
                        />

                        <!-- 提示 -->
                        <div class="tags-hint">
                            💡 提示：用空格或逗号分隔多个标签，如：心理学 记知 学习
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部按钮 -->
            <div class="dialog-footer">
                <button class="btn btn-secondary" id="continueBtn">继续记录</button>
                <button class="btn btn-primary" id="saveBtn">保存并关闭</button>
            </div>
        </div>

        <!-- 外部提示 -->
        <div class="external-hint">模拟智能识别功能</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const sourceBtns = document.querySelectorAll('.source-btn');
        const sourceDetailInput = document.getElementById('sourceDetailInput');
        const contentTextarea = document.getElementById('contentTextarea');
        const clipboardBtn = document.getElementById('clipboardBtn');
        const clipboardCount = document.getElementById('clipboardCount');
        const floatingStatus = document.getElementById('floatingStatus');
        const tagsBtn = document.getElementById('tagsBtn');
        const tagsSection = document.getElementById('tagsSection');
        const tagsDisplay = document.getElementById('tagsDisplay');
        const tagInput = document.getElementById('tagInput');
        const tagsCount = document.getElementById('tagsCount');
        const saveBtn = document.getElementById('saveBtn');
        const continueBtn = document.getElementById('continueBtn');
        const toast = document.getElementById('toast');
        const closeBtn = document.querySelector('.close-btn');
        const smartHint = document.getElementById('smartHint');
        const hintContent = document.getElementById('hintContent');
        const hintActions = document.getElementById('hintActions');
        const hintConfirm = document.getElementById('hintConfirm');
        const hintIgnore = document.getElementById('hintIgnore');

        let selectedSource = null;
        let clipboardPasted = 0;
        let tags = [];
        let demoContent = [
            "间隔重复效应可以显著提高记忆效率",
            "在遗忘临界点前复习，记忆效果最好",
            "这个原理基于艾宾浩斯遗忘曲线"
        ];
        let demoIndex = 0;

        // 来源按钮点击
        sourceBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const source = btn.dataset.source;

                // 切换激活状态
                sourceBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                selectedSource = source;

                // 更新输入框占位符
                const placeholders = {
                    book: '《书名》',
                    podcast: '播客名称',
                    web: '网站名称或 URL',
                    conversation: '与谁对话',
                    course: '课程名称',
                    other: '请输入'
                };

                sourceDetailInput.placeholder = placeholders[source];
                sourceDetailInput.focus();

                showToast(`📖 已选择"${btn.querySelector('.label').textContent}"`);
            });
        });

        // 来源详情输入监听
        sourceDetailInput.addEventListener('input', () => {
            const value = sourceDetailInput.value.trim();

            // 智能识别 URL
            if (value.startsWith('http')) {
                showSmartHint('💓 检测到 URL，是否设为"网络"来源？', () => {
                    selectSource('web');
                    sourceDetailInput.value = value;
                });
            }
            // 智能识别书名号
            else if (value.includes('《') && value.includes('》')) {
                showSmartHint('💓 检测到书名号，是否选择"书籍"来源？', () => {
                    selectSource('book');
                    sourceDetailInput.value = value;
                });
            }
            // 智能识别内容过长
            else if (contentTextarea.value.length > 200) {
                showSmartHint('⚠️ 内容超过 200 字，建议分段保存以便整理', null);
            } else {
                hideSmartHint();
            }
        });

        // 内容输入监听
        contentTextarea.addEventListener('input', () => {
            const value = contentTextarea.value.trim();

            // 智能识别 URL
            if (value.startsWith('http')) {
                showSmartHint('💓 检测到 URL，是否设为"网络"来源？', () => {
                    selectSource('web');
                    // 从内容中提取标题
                    const urlMatch = value.match(/https?:\/\/[^\/\s]+/);
                    if (urlMatch) {
                        sourceDetailInput.value = urlMatch[0];
                    }
                });
            }
            // 智能识别书名号
            else if (value.includes('《') && value.includes('》')) {
                showSmartHint('💓 检测到书名号，是否选择"书籍"来源？', () => {
                    selectSource('book');
                    // 提取书名
                    const bookMatch = value.match(/《(.+?)》/);
                    if (bookMatch) {
                        sourceDetailInput.value = bookMatch[1];
                    }
                });
            }
            // 内容过长提示
            else if (value.length > 200) {
                showSmartHint('⚠️ 内容超过 200 字，建议分段保存', null);
            } else {
                hideSmartHint();
            }
        });

        // 显示智能提示
        function showSmartHint(message, onConfirm) {
            hintContent.textContent = message;
            smartHint.classList.add('show');

            if (onConfirm) {
                hintActions.style.display = 'flex';
                hintConfirm.onclick = () => {
                    onConfirm();
                    hideSmartHint();
                };
                hintIgnore.onclick = () => {
                    hideSmartHint();
                };
            } else {
                hintActions.style.display = 'none';
                // 3秒后自动隐藏
                setTimeout(hideSmartHint, 3000);
            }
        }

        // 隐藏智能提示
        function hideSmartHint() {
            smartHint.classList.remove('show');
        }

        // 选择来源
        function selectSource(source) {
            const btn = document.querySelector(`.source-btn[data-source="${source}"]`);
            if (btn) {
                btn.click();
            }
        }

        // 模拟剪切板粘贴
        function simulatePaste() {
            if (demoIndex < demoContent.length) {
                const content = demoContent[demoIndex];
                const currentContent = contentTextarea.value;

                if (currentContent) {
                    contentTextarea.value = currentContent + '\n' + content;
                } else {
                    contentTextarea.value = content;
                }

                contentTextarea.focus();
                contentTextarea.setSelectionRange(contentTextarea.value.length, contentTextarea.value.length);

                clipboardPasted++;
                clipboardCount.textContent = clipboardPasted;
                clipboardBtn.classList.add('has-clipboard');

                // 更新悬浮窗状态
                floatingStatus.classList.add('ready');
                floatingStatus.innerHTML = '<span class="icon">✓</span><span>已添加</span>';

                showToast(`📋 已添加第 ${clipboardPasted} 条内容`);

                demoIndex++;

                // 2秒后恢复悬浮窗状态
                setTimeout(() => {
                    floatingStatus.classList.remove('ready');
                    floatingStatus.innerHTML = '<span class="icon">💓</span><span>可粘贴</span>';
                }, 2000);
            } else {
                showToast('📋 演示内容已全部添加');
            }
        }

        // 点击剪切板按钮
        clipboardBtn.addEventListener('click', simulatePaste);

        // 点击悬浮窗状态也触发粘贴
        floatingStatus.addEventListener('click', simulatePaste);

        // 标签功能
        tagsBtn.addEventListener('click', () => {
            tagsSection.style.display = tagsSection.style.display === 'none' ? 'block' : 'none';
            if (tagsSection.style.display === 'block') {
                tagsBtn.classList.add('active');
                tagInput.focus();
            } else {
                tagsBtn.classList.remove('active');
            }
        });

        // 添加标签
        tagInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const input = tagInput.value.trim();
                if (input) {
                    const newTags = input
                        .replace(/#/g, '')
                        .split(/[,\s，]+/)
                        .filter(tag => tag.trim().length > 0)
                        .map(tag => tag.trim());

                    newTags.forEach(tag => {
                        if (!tags.includes(tag)) {
                            tags.push(tag);
                            addTagToDisplay(tag);
                        }
                    });

                    tagInput.value = '';
                    updateTagsCount();
                }
            }
        });

        // 添加标签到显示区
        function addTagToDisplay(tag) {
            const tagEl = document.createElement('div');
            tagEl.className = 'tag';
            tagEl.innerHTML = `
                <span class="tag-text">#${tag}</span>
                <span class="tag-remove" data-tag="${tag}">✕</span>
            `;
            tagsDisplay.appendChild(tagEl);
        }

        // 删除标签
        tagsDisplay.addEventListener('click', (e) => {
            if (e.target.classList.contains('tag-remove')) {
                const tagToRemove = e.target.dataset.tag;
                tags = tags.filter(t => t !== tagToRemove);
                e.target.parentElement.remove();
                updateTagsCount();
                showToast(`🏷️ 已删除标签 #${tagToRemove}`);
            }
        });

        // 更新标签计数
        function updateTagsCount() {
            tagsCount.textContent = tags.length;
            if (tags.length > 0) {
                tagsBtn.classList.add('active');
            } else {
                tagsBtn.classList.remove('active');
            }
        }

        // 保存并关闭
        saveBtn.addEventListener('click', () => {
            const content = contentTextarea.value.trim();
            if (content) {
                const sourceInfo = selectedSource ? document.querySelector('.source-btn.active .label').textContent : '无';
                showToast(`📖 已保存到启发（来源：${sourceInfo}）`);
                setTimeout(() => {
                    resetDialog();
                }, 1500);
            } else {
                showToast('⚠️ 请输入内容');
            }
        });

        // 继续记录
        continueBtn.addEventListener('click', () => {
            const content = contentTextarea.value.trim();
            if (content) {
                showToast('📖 已保存，可继续记录');
                contentTextarea.value = '';
                clipboardPasted = 0;
                clipboardCount.textContent = '0';
                clipboardBtn.classList.remove('has-clipboard');
                demoIndex = 0;
            } else {
                showToast('⚠️ 请输入内容');
            }
        });

        // 关闭按钮
        closeBtn.addEventListener('click', () => {
            if (contentTextarea.value.trim()) {
                if (confirm('内容未保存，确定关闭吗？')) {
                    resetDialog();
                }
            } else {
                resetDialog();
            }
        });

        // 重置对话框
        function resetDialog() {
            contentTextarea.value = '';
            sourceDetailInput.value = '';
            sourceBtns.forEach(b => b.classList.remove('active'));
            selectedSource = null;
            clipboardPasted = 0;
            clipboardCount.textContent = '0';
            clipboardBtn.classList.remove('has-clipboard');
            demoIndex = 0;
            tags = [];
            tagsDisplay.innerHTML = '';
            tagsCount.textContent = '0';
            tagsBtn.classList.remove('active');
            tagsSection.style.display = 'none';
            hideSmartHint();
        }

        // 显示 Toast
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                saveBtn.click();
            }
            if (e.key === 'Escape') {
                closeBtn.click();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'Enter') {
                continueBtn.click();
            }
        });

        // 自动聚焦内容输入框
        contentTextarea.focus();
    </script>
</body>
</html>
